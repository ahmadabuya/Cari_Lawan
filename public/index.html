<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b20">
<title>LigaTemu — Cari Lawan Bola</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=DM+Sans:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f4ef;color:#14291e;font:16px 'DM Sans',sans-serif}header{background:#102b20;color:white}nav,.hero,main{width:min(1120px,calc(100% - 32px));margin:auto}nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid #ffffff29}.brand,h1,h2,h3{font-family:'Barlow Condensed',sans-serif}.brand{font-size:28px;font-weight:700}.brand span{color:#d5f567}.hero{position:relative;padding:42px 0;overflow:hidden}.hero>*{position:relative}.pitch{position:absolute;width:40%;height:140%;right:0;top:-20%;opacity:.25;transform:rotate(-17deg);border:2px solid #afdf87;background:repeating-linear-gradient(90deg,#457548 0 12%,#588752 12% 24%)}.pitch:after{content:'';position:absolute;inset:35% 30%;border:2px solid #afdf87;border-radius:50%}h1{font-size:clamp(48px,9vw,94px);line-height:.92;margin:0;max-width:650px}h1 span{color:#d5f567}p{line-height:1.5}.hero p{max-width:470px;color:#d8e6db}main{padding:24px 0 60px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.toolbar h2{font-size:34px;margin:0 auto 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,275px),1fr));gap:16px}.card,dialog{background:white;border:1px solid #dbe5da;border-radius:18px;padding:20px}.card{display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere}.card h3{font-size:30px;margin:0}.card p{margin:0}.card button{margin-top:auto}.badge{align-self:start;padding:4px 10px;border-radius:20px;background:#e5efdc;font-size:13px;font-weight:700}.badge.DEAL{background:#e8e9ed}.badge.WAITING{background:#fff0b7}button,input,select,textarea{font:inherit;border-radius:9px;padding:10px 12px}button{cursor:pointer;border:0;background:#174d35;color:white;font-weight:700}button.accent{background:#d5f567;color:#102b20}button.secondary{background:#e8efe7;color:#174d35}button:disabled{cursor:default;opacity:.55}input,select,textarea{border:1px solid #c9d7cb;background:white;color:inherit;max-width:100%;min-width:0}dialog{width:min(570px,calc(100% - 24px));max-height:90vh;overflow:auto}dialog::backdrop{background:#0b1d16bb}.dialog-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.dialog-head h2{margin:0 0 12px;font-size:34px;overflow-wrap:anywhere}form,label{display:grid;gap:6px}form{gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two label{min-width:0}.thread{border-top:1px solid #dbe5da;padding:12px 0;overflow-wrap:anywhere}.thread h3{margin:0 0 8px;font-size:24px}.message{background:#f1f5ef;border-radius:8px;padding:8px;margin:6px 0;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.error{color:#a02222}[hidden]{display:none!important}@media(max-width:530px){.toolbar>*:not(h2){flex:1 1 100%}.toolbar h2{width:100%}.pitch{width:55%}}
.hero{padding-block:clamp(48px,8vw,92px)}header{background:radial-gradient(ellipse at 85% 0%,#245d3b,#102b20 65%)}.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,315px),1fr))}.card{box-shadow:0 12px 32px #162f2210;gap:13px}.card h3{font:700 16px 'DM Sans',sans-serif}.matchup{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;text-align:center;background:#edf4eb;border-radius:14px;padding:16px 8px}.team{display:grid;justify-items:center;gap:8px}.crest{width:64px;height:64px;border-radius:14px;background:#fff;object-fit:contain;display:grid;place-items:center;font:700 25px 'Barlow Condensed',sans-serif;color:#1b5537;border:1px solid #dce8db}.versus{font:700 26px 'Barlow Condensed',sans-serif;color:#1b5537}.mapLink{color:#174d35;font-weight:700;display:inline-block;padding:8px 0}.card .actions{margin:0}.card .primary{width:100%}.uploadOpponent{margin:12px 0}.hint{font-size:13px;color:#496256}.shareText{width:100%}
</style>
</head>
<body>
<header><nav><div class="brand">Liga<span>Temu</span></div><div class="actions"><button class="secondary" id="install">Pasang Aplikasi</button><button class="accent" id="new">+ Buat Kartu</button></div></nav>
<div class="hero"><div class="pitch" aria-hidden="true"></div><h1>Cari lawan.<br><span>Siap main.</span></h1><p>Temukan tim untuk sparing futsal, mini soccer, atau sepak bola di sekitar kamu.</p></div></header>
<main><div class="toolbar"><h2>Jadwal Sparing</h2><input id="search" type="search" placeholder="Cari tim atau lokasi" aria-label="Cari tim atau lokasi"><select id="filter" aria-label="Filter status"><option value="">Semua status</option><option value="OPEN">Cari Lawan</option><option value="WAITING">Menunggu Konfirmasi</option><option value="DEAL">Deal</option></select><button id="refresh" class="secondary">Muat Ulang</button></div><p id="notice" role="status"></p><div class="grid" id="cards"></div></main>
<dialog id="create"><div class="dialog-head"><h2 id="formTitle">Buat Kartu Sparing</h2><button class="secondary close" type="button" aria-label="Tutup">×</button></div>
<form id="createForm"><label>Nama tim<input name="team" required maxlength="60"></label><label>Logo tim Anda <input type="file" name="logo1" accept="image/png,image/jpeg,image/webp"></label><label>Lokasi lapangan<input name="place" required maxlength="100"></label><label>Link Google Maps <input type="url" name="mapUrl" maxlength="1000" placeholder="Tempel link dari tombol Bagikan di Google Maps"><small class="hint">Opsional. Jika kosong, Maps akan mencari nama lokasi lapangan.</small></label><label>Format<select name="format"><option>Futsal</option><option>Mini Soccer</option><option>Sepak Bola</option></select></label><div class="two"><label>Tanggal<input type="date" name="date" required></label><label>Jam (WIB)<input type="time" name="time" required></label></div><label>Catatan<textarea name="note" maxlength="300" placeholder="Contoh: biaya lapangan dibagi dua"></textarea></label><p id="createError" class="error" role="alert" hidden></p><button id="formSubmit">Terbitkan Kartu</button></form></dialog>
<dialog id="detail"><div class="dialog-head"><h2 id="detailTitle"></h2><button class="secondary close" type="button" aria-label="Tutup">×</button></div><p id="detailError" class="error" role="alert" hidden></p><div id="threads"></div></dialog>
<dialog id="share"><div class="dialog-head"><h2>Bagikan Lokasi</h2><button class="secondary close" type="button" aria-label="Tutup">×</button></div><p>Salin tautan di bawah untuk dikirim ke tim lawan.</p><input class="shareText" id="shareText" aria-label="Tautan lokasi" readonly></dialog>
<dialog id="installHelp"><div class="dialog-head"><h2>Pasang LigaTemu</h2><button class="secondary close" type="button" aria-label="Tutup">×</button></div><p id="installInstructions"></p></dialog>
<script>
const $ = id => document.getElementById(id);
const labels = {OPEN:'Cari Lawan', WAITING:'Menunggu Konfirmasi', DEAL:'DEAL'};
let token, cards = [], selected, editingId, detailVersion = 0, listVersion = 0;
async function rpc(method, ...args) {
  if (!navigator.onLine) throw new Error('Sambungkan internet untuk memuat atau menyimpan data.');
  const response = await fetch('https://cari-lawan.ahmadabuya0.workers.dev/api/ligatemu',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({method,args:[token,...args]})
  });
  const result = await response.json().catch(() => { throw new Error('API LigaTemu belum tersedia.'); });
  if (!response.ok || !result.ok) throw new Error(result.error || 'Permintaan gagal.');
  return result.value;
}

let installPrompt;
const install = $('install');
if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) install.hidden = true;
window.addEventListener('beforeinstallprompt',event => {
  event.preventDefault();
  installPrompt = event;
});
window.addEventListener('appinstalled',() => {
  installPrompt = null;
  install.hidden = true;
});
install.onclick = async () => {
  if (installPrompt) {
    const prompt = installPrompt;
    installPrompt = null;
    try {
      await prompt.prompt();
      return;
    } catch {}
  }
  const appleMobile = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  $('installInstructions').textContent = appleMobile
    ? 'Buka di Safari, ketuk Bagikan, lalu pilih Tambahkan ke Layar Utama.'
    : 'Buka menu browser di Chrome atau Edge, lalu pilih Pasang aplikasi atau Tambahkan ke layar utama jika tersedia.';
  $('installHelp').showModal();
};
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

function errorAt(id, error) {
  $(id).hidden = !error;
  $(id).textContent = error ? error.message || String(error) : '';
}
function el(tag, value, cls) {
  const node = document.createElement(tag);
  if (value) node.textContent = value;
  if (cls) node.className = cls;
  return node;
}
function button(label, handler, cls) {
  const node = el('button', label, cls);
  node.type = 'button';
  node.onclick = handler;
  return node;
}
async function encodeLogo(file) {
  if (!['image/png','image/jpeg','image/webp'].includes(file.type) || file.size > 5 * 1024 * 1024) {
    throw new Error('Pilih logo PNG, JPG, atau WebP dengan ukuran maksimal 5 MB.');
  }
  const image = await createImageBitmap(file).catch(() => { throw new Error('File logo tidak bisa dibuka.'); });
  try {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    for (const size of [128,96,72,48]) {
      const scale = Math.min(size / image.width, size / image.height, 1);
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      ctx.drawImage(image,0,0,canvas.width,canvas.height);
      const logo = canvas.toDataURL('image/png');
      if (logo.length <= 18000) return logo;
    }
    throw new Error('Logo terlalu besar setelah dikompresi.');
  } finally { image.close(); }
}
function teamTile(name, logo) {
  const tile = el('div','','team');
  const crest = logo ? el('img','','crest') : el('span',name === 'Cari lawan' ? '?' : name.slice(0,2).toUpperCase(),'crest');
  if (logo) { crest.src = logo; crest.alt = ''; crest.loading = 'lazy'; }
  tile.append(crest,el('h3',name));
  return tile;
}
async function shareLocation(card) {
  if (navigator.share) {
    try {
      await navigator.share({title:card.place,url:card.mapUrl});
      return;
    } catch(error) { if (error.name === 'AbortError') return; }
  }
  const input = $('shareText');
  input.value = card.mapUrl;
  $('share').showModal();
  input.focus();
  input.select();
}
function renderCards() {
  const query = $('search').value.trim().toLowerCase(), filter = $('filter').value;
  const visible = cards.filter(c => (!filter || c.status === filter) &&
    [c.team,c.place,c.format].some(v => v.toLowerCase().includes(query)));
  $('cards').replaceChildren(...visible.map(c => {
    const card = el('article', '', 'card');
    const open = button(c.accessible ? 'Buka Kartu' : 'Kartu Terkunci', () => showCard(c), 'primary');
    const matchup = el('div','','matchup');
    matchup.append(teamTile(c.team,c.logo1),el('span','VS','versus'),teamTile(c.opponentTeam || 'Cari lawan',c.logo2));
    const map = el('a','Buka Maps','mapLink');
    map.href = c.mapUrl; map.target = '_blank'; map.rel = 'noopener noreferrer';
    const actions = el('div','','actions');
    actions.append(map,button('Bagikan Lokasi',()=>shareLocation(c),'secondary'));
    open.disabled = !c.accessible;
    card.append(el('span', labels[c.status], 'badge ' + c.status), matchup,
      el('p', c.format + ' · ' + c.place), el('p', c.date.split('-').reverse().join('/') + ' · ' + c.time + ' WIB'));
    if (c.note) card.append(el('p', c.note));
    if (c.owner) {
      card.append(el('small', 'Kartu Anda'));
      actions.append(button('Edit Kartu', () => openForm(c), 'secondary'));
    }
    card.append(actions,open);
    return card;
  }));
  $('notice').textContent = visible.length ? '' : 'Belum ada kartu yang cocok.';
}
async function refresh() {
  const version = ++listVersion;
  $('notice').textContent = 'Memuat jadwal…';
  try {
    const result = await rpc('listCards');
    if (version !== listVersion) return;
    cards = result;
    renderCards();
  } catch(error) {
    if (version === listVersion) $('notice').textContent = error.message || 'Jadwal gagal dimuat.';
  }
}
async function showCard(c) {
  const version = ++detailVersion;
  selected = c;
  $('detailTitle').textContent = c.team;
  errorAt('detailError');
  $('threads').replaceChildren(el('p','Memuat komentar…'));
  if (!$('detail').open) $('detail').showModal();
  try {
    const data = await rpc('getCard', c.id);
    if (version === detailVersion && $('detail').open) renderDetail(c, data);
  } catch(error) {
    if (version !== detailVersion) return;
    $('threads').replaceChildren();
    errorAt('detailError', error);
    refresh();
  }
}
async function act(action, fields, control) {
  const card = selected, version = detailVersion;
  control.disabled = true;
  errorAt('detailError');
  try {
    await rpc('mutate', action, {...fields,id:card.id});
    refresh();
    if (version === detailVersion && $('detail').open) await showCard(card);
  } catch(error) {
    if (version === detailVersion) errorAt('detailError',error);
  } finally { control.disabled = false; }
}
function reply(container, thread, needsName) {
  const form = el('form');
  if (needsName) {
    const label = el('label','Nama tim Anda');
    const input = el('input'); input.name='team'; input.required=true; input.maxLength=60;
    label.append(input); form.append(label);
  }
  const label = el('label','Komentar');
  const input = el('textarea'); input.name='text'; input.required=true; input.maxLength=500;
  const send = el('button','Kirim Komentar');
  label.append(input); form.append(label,send);
  form.onsubmit = event => {
    event.preventDefault();
    act('comment', {...Object.fromEntries(new FormData(form)),thread},send);
  };
  container.append(form);
}
function renderDetail(card, data) {
  const area = $('threads');
  const actions = el('div','','actions');
  area.replaceChildren(el('p',labels[data.status]),actions);
  actions.append(button('Muat Ulang Komentar',()=>showCard(card),'secondary'));
  if (data.owner && data.status === 'DEAL') {
    const form = el('form','','uploadOpponent');
    const label = el('label','Logo Tim 2 (Lawan)');
    const input = el('input');
    input.type = 'file'; input.accept = 'image/png,image/jpeg,image/webp'; input.required = true;
    const submit = el('button','Simpan Logo Lawan');
    label.append(input); form.append(label,submit); area.append(form);
    form.onsubmit = async event => {
      event.preventDefault();
      const version = detailVersion;
      submit.disabled = true;
      try {
        const logo2 = await encodeLogo(input.files[0]);
        if (version === detailVersion && $('detail').open) await act('logo2',{logo2},submit);
      } catch(error) {
        if (version === detailVersion) errorAt('detailError',error);
      } finally { submit.disabled = false; }
    };
  }
  if (data.owner && data.status === 'WAITING') {
    const cancel = button('Tarik Usulan',()=>act('cancel',{},cancel),'secondary');
    actions.append(cancel);
  }
  if (data.proposed && data.status === 'WAITING') {
    const accept = button('Konfirmasi DEAL',()=>act('accept',{},accept));
    actions.append(accept);
  }
  if (!data.threads.length && data.owner) area.append(el('p','Belum ada tim yang mengirim komentar.'));
  data.threads.forEach(thread => {
    const section = el('section','','thread');
    section.append(el('h3',thread.team + (thread.proposed ? ' · Tim Terpilih' : '')));
    thread.messages.forEach(m => section.append(el('p',m.team + '\n' + m.text,'message')));
    if (data.status !== 'DEAL') reply(section,thread.id,false);
    if (data.owner && data.status === 'OPEN') {
      const actions = el('div','','actions');
      const propose = button('Pilih Tim Ini',()=>act('propose',{thread:thread.id},propose));
      actions.append(propose); section.append(actions);
    }
    area.append(section);
  });
  if (!data.owner && !data.threads.length && data.status !== 'DEAL') reply(area,'',true);
}
function openForm(card) {
  const form = $('createForm');
  form.reset();
  editingId = card?.id || '';
  $('formTitle').textContent = card ? 'Edit Kartu Sparing' : 'Buat Kartu Sparing';
  $('formSubmit').textContent = card ? 'Simpan Perubahan' : 'Terbitkan Kartu';
  if (card) {
    for (const name of ['team','place','format','date','time','note']) form.elements.namedItem(name).value = card[name];
    form.elements.namedItem('mapUrl').value = card.customMapUrl;
  }
  errorAt('createError');
  $('create').showModal();
}
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('detail').addEventListener('close',()=>{detailVersion++;});
$('new').onclick=()=>openForm();
$('refresh').onclick=refresh;
$('search').oninput=renderCards;
$('filter').onchange=renderCards;
$('createForm').onsubmit=async event=>{
  event.preventDefault();
  const submit=event.submitter;
  const id = editingId;
  submit.disabled=true;
  const dialog = $('create');
  const close = dialog.querySelector('.close');
  close.disabled = true;
  const preventCancel = event => event.preventDefault();
  dialog.addEventListener('cancel',preventCancel);
  errorAt('createError');
  try {
    const fields = Object.fromEntries(new FormData(event.target));
    fields.logo1 = fields.logo1.size ? await encodeLogo(fields.logo1) : '';
    await rpc('mutate', id ? 'edit' : 'create', {...fields,id});
    event.target.reset(); $('create').close(); refresh();
  } catch(error) { errorAt('createError',error); }
  finally {
    submit.disabled=false;
    close.disabled=false;
    dialog.removeEventListener('cancel',preventCancel);
  }
};
try {
  token = localStorage.getItem('ligatemuIdentity');
  if (!/^[a-f0-9]{64}$/.test(token || '')) {
    token = Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');
    localStorage.setItem('ligatemuIdentity',token);
  }
  refresh();
} catch(error) {
  $('notice').textContent='Aktifkan penyimpanan browser untuk memakai LigaTemu.';
  $('new').disabled=true;
  $('refresh').disabled=true;
}
</script>
</body>
</html>
